name: Independent application checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 ../tools/fetch-vendor.py
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build
